<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Topic Sender Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>🚀</span> Telegram Topic Dispatcher
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Format & send split 1-click copyable messages directly to your Supergroup Topic.
        </p>
      </div>
      <button id="toggleRawBtn" type="button" class="text-xs bg-slate-700 hover:bg-slate-600 text-sky-400 font-medium px-3.5 py-2 rounded-lg border border-slate-600 transition">
        📋 Paste Raw 4-Line Text Instead
      </button>
    </div>

    <!-- Raw 4-Line Quick Importer (Hidden by default) -->
    <div id="rawImportBox" class="hidden bg-slate-800/90 border border-sky-500/40 rounded-2xl p-5 mb-6">
      <label class="block text-sm font-semibold text-sky-400 mb-2">
        Quick Paste (Line 1: Headline, Line 2: Product Name, Line 3: Code, Line 4+: Body)
      </label>
      <textarea id="rawTextInput" rows="5" placeholder="Headline Here&#10;Product Name Here&#10;PROD-CODE-123&#10;First section...&#10;---&#10;Second section..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500"></textarea>
      <button id="applyRawBtn" type="button" class="mt-3 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
        ⬇️ Auto-Fill Form Below
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Column: Input Form -->
      <form id="senderForm" class="lg:col-span-7 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg space-y-4">
        
        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
            🔒 Admin Password *
          </label>
          <input type="password" id="password" required placeholder="Enter your ADMIN_PASSWORD" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
        </div>

        <!-- Line 1: Headline -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
            1️⃣ Headline / Title (Auto-Uppercased) *
          </label>
          <input type="text" id="headline" required placeholder="e.g. New Summer Arrival" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
        </div>

        <!-- Line 2 & 3: Product Name & Code -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
              2️⃣ Product Name (1-Click Copy) *
            </label>
            <input type="text" id="productName" required placeholder="e.g. Ultra Running Shoes" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
              3️⃣ Product Code (1-Click Copy) *
            </label>
            <input type="text" id="productCode" required placeholder="e.g. SKU-9920" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <!-- Line 4+: Body Content -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
              4️⃣ Body Sections *
            </label>
            <button type="button" id="insertDelimiterBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-sky-300 px-2.5 py-1 rounded-md transition">
              + Insert Delimiter (---)
            </button>
          </div>
          <textarea id="bodyText" rows="7" required placeholder="Write first message section here...&#10;---&#10;Write second message section here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-sm text-white font-mono focus:outline-none focus:border-sky-500"></textarea>
        </div>

        <!-- Advanced Options Accordion -->
        <details class="bg-slate-900/60 border border-slate-700/80 rounded-xl p-3.5">
          <summary class="text-xs font-semibold text-slate-300 cursor-pointer select-none">
            ⚙️ Custom Emoji, Delimiter & Target Topic Override (Optional)
          </summary>
          <div class="grid grid-cols-2 gap-3 mt-3 pt-3 border-t border-slate-700/60">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Headline Emoji</label>
              <input type="text" id="emoji" value="📌" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Section Delimiter</label>
              <input type="text" id="delimiter" value="---" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Override Chat ID</label>
              <input type="text" id="customChatId" placeholder="Uses .env default" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Override Topic ID</label>
              <input type="text" id="customTopicId" placeholder="Uses .env default" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white font-mono" />
            </div>
          </div>
        </details>

        <!-- Status Alert -->
        <div id="statusBox" class="hidden rounded-xl p-3.5 text-sm font-medium"></div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <span>🚀 Send Messages to Telegram Topic</span>
        </button>
      </form>

      <!-- Right Column: Live Telegram Preview -->
      <div class="lg:col-span-5 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">
            📱 Live Telegram Preview
          </h2>
          <span id="sectionCounter" class="text-xs bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2.5 py-0.5 rounded-full font-semibold">
            0 Messages
          </span>
        </div>

        <div id="previewContainer" class="space-y-3 overflow-y-auto max-h-[520px] pr-1 flex-1">
          <p class="text-slate-500 text-sm italic text-center py-12">
            Start typing on the left to preview how your split messages will appear in Telegram...
          </p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const passwordEl = document.getElementById('password');
    const headlineEl = document.getElementById('headline');
    const productNameEl = document.getElementById('productName');
    const productCodeEl = document.getElementById('productCode');
    const bodyTextEl = document.getElementById('bodyText');
    const emojiEl = document.getElementById('emoji');
    const delimiterEl = document.getElementById('delimiter');
    const customChatIdEl = document.getElementById('customChatId');
    const customTopicIdEl = document.getElementById('customTopicId');
    const previewContainer = document.getElementById('previewContainer');
    const sectionCounter = document.getElementById('sectionCounter');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');

    // Remember password in browser localStorage for convenience
    if (localStorage.getItem('tg_admin_pass')) {
      passwordEl.value = localStorage.getItem('tg_admin_pass');
    }

    // Toggle Raw 4-Line Paste Box
    document.getElementById('toggleRawBtn').addEventListener('click', () => {
      document.getElementById('rawImportBox').classList.toggle('hidden');
    });

    // Parse Raw 4-line text into individual fields
    document.getElementById('applyRawBtn').addEventListener('click', () => {
      const raw = document.getElementById('rawTextInput').value.replace(/\r\n/g, '\n').trim();
      const lines = raw.split('\n');
      if (lines.length < 4) {
        alert('Please enter at least 4 lines (Line 1: Headline, Line 2: Name, Line 3: Code, Line 4+: Body).');
        return;
      }
      headlineEl.value = lines[0].trim();
      productNameEl.value = lines[1].trim();
      productCodeEl.value = lines[2].trim();
      bodyTextEl.value = lines.slice(3).join('\n').trim();
      document.getElementById('rawImportBox').classList.add('hidden');
      updatePreview();
    });

    // Insert delimiter button
    document.getElementById('insertDelimiterBtn').addEventListener('click', () => {
      const delim = delimiterEl.value || '---';
      const start = bodyTextEl.selectionStart;
      const end = bodyTextEl.selectionEnd;
      const current = bodyTextEl.value;
      bodyTextEl.value = current.substring(0, start) + `\n${delim}\n` + current.substring(end);
      bodyTextEl.focus();
      updatePreview();
    });

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function updatePreview() {
      const headline = headlineEl.value.trim().toUpperCase() || 'HEADLINE HERE';
      const productName = productNameEl.value.trim() || 'Product Name';
      const productCode = productCodeEl.value.trim() || 'CODE-123';
      const emoji = emojiEl.value || '📌';
      const delimiter = delimiterEl.value || '---';
      const rawBody = bodyTextEl.value;

      const sections = rawBody
        .split(delimiter)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      sectionCounter.textContent = `${sections.length} Message${sections.length === 1 ? '' : 's'}`;

      if (sections.length === 0 && !headlineEl.value && !productNameEl.value) {
        previewContainer.innerHTML = `<p class="text-slate-500 text-sm italic text-center py-12">Start typing on the left to preview how your split messages will appear in Telegram...</p>`;
        return;
      }

      const previewItems = (sections.length ? sections : ['Your section text will appear inside this 1-click copyable code block...']).map((sec, idx) => `
        <div class="bg-slate-900 border border-slate-700/80 rounded-xl p-3.5 text-xs space-y-1.5 shadow">
          <div class="text-[10px] text-sky-400 font-semibold uppercase tracking-wider mb-1">
            Message #${idx + 1}
          </div>
          <div class="font-bold text-white text-sm">
            ${escapeHTML(emoji)} ${escapeHTML(headline)} ${escapeHTML(emoji)}
          </div>
          <div class="pt-1">
            📦 <span class="font-semibold">Product Name:</span>
            <code class="bg-slate-800 text-amber-300 px-1.5 py-0.5 rounded border border-slate-700">${escapeHTML(productName)}</code>
          </div>
          <div>
            🔖 <span class="font-semibold">Product Code:</span>
            <code class="bg-slate-800 text-amber-300 px-1.5 py-0.5 rounded border border-slate-700">${escapeHTML(productCode)}</code>
          </div>
          <pre class="bg-slate-950 text-emerald-300 p-2.5 rounded-lg border border-slate-800 overflow-x-auto whitespace-pre-wrap font-mono mt-2">${escapeHTML(sec)}</pre>
        </div>
      `);

      previewContainer.innerHTML = previewItems.join('');
    }

    [headlineEl, productNameEl, productCodeEl, bodyTextEl, emojiEl, delimiterEl].forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    // Handle Form Submission
    document.getElementById('senderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>⏳ Sending Messages... Please wait</span>`;

      localStorage.setItem('tg_admin_pass', passwordEl.value);

      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: passwordEl.value,
            headline: headlineEl.value,
            productName: productNameEl.value,
            productCode: productCodeEl.value,
            bodyText: bodyTextEl.value,
            emoji: emojiEl.value,
            delimiter: delimiterEl.value,
            customChatId: customChatIdEl.value,
            customTopicId: customTopicIdEl.value,
          }),
        });

        const data = await response.json();

        statusBox.classList.remove('hidden');
        if (response.ok && data.ok) {
          statusBox.className = 'rounded-xl p-3.5 text-sm font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
          statusBox.textContent = `✅ ${data.message}`;
          bodyTextEl.value = '';
          updatePreview();
        } else {
          statusBox.className = 'rounded-xl p-3.5 text-sm font-medium bg-rose-500/20 text-rose-300 border border-rose-500/40';
          statusBox.textContent = `❌ ${data.error || 'Something went wrong.'}`;
        }
      } catch (err) {
        statusBox.classList.remove('hidden');
        statusBox.className = 'rounded-xl p-3.5 text-sm font-medium bg-rose-500/20 text-rose-300 border border-rose-500/40';
        statusBox.textContent = `❌ Network error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>🚀 Send Messages to Telegram Topic</span>`;
      }
    });
  </script>
</body>
</html>
